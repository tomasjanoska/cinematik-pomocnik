<body>
  <a class="skip" href="#board">Preskočiť na program</a>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-copy">
          <h1>
            <span class="eyebrow" id="app-name">Cinematik v mobile</span>
            Cinematik <em>2026</em>
          </h1>
          <p class="disclaimer" id="disclaimer">Neoficiálny pomocník na festival (8.–13. 9. 2026). Nie je to oficiálna aplikácia MFF Cinematik.</p>
        </div>
        <div class="brand-tools">
          <button type="button" class="icon-btn now-btn" id="btn-now" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="now-label">Teraz</span>
          </button>
          <button type="button" class="icon-btn" id="btn-settings" aria-label="Nastavenia">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c0 .7.4 1.3 1 1.5H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
      </div>
      <div class="days" role="tablist" aria-label="Deň festivalu" id="days"></div>
      <nav class="toolbar" id="toolbar" aria-label="Program">
        <button type="button" class="tab chip" id="btn-program" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          <span id="program-label">Program</span>

          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 14.5 9l6.3.6-4.8 4.1 1.5 6.1L12 16.5 6.5 19.8 8 13.7 3.2 9.6 9.5 9z"/></svg>
          <span id="fav-label">Obľúbené</span>
        </button>
        <button type="button" class="tab chip" id="btn-res-mine">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2.5 2.5"/></svg>
          <span id="res-mine-label">Rezervácie</span>

      <div class="filt-host" id="filt-inline">

          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

          </div>

      </div>
      <div class="controls">
        <button type="button" class="filt-btn" id="filt-open" aria-haspopup="dialog" aria-controls="filt-sheet" data-on="false">

          <span id="filt-sum">Filtre</span>
          <span class="badge" id="filt-n" hidden></span>
        </button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="seg" role="group" aria-label="Zobrazenie">

    </header>
    <main class="board-wrap" id="main">
      <div class="skel" id="skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </main>
    <footer class="foot" id="foot">Zdroj: Inviton EventSchedulePublic · <a href="https://cinematik.sk/program?st=1">cinematik.sk/program</a> · Nápady: <a href="mailto:cmnapady@pocuj.com">cmnapady@pocuj.com</a></footer>
  </div>
  <dialog id="detail" aria-labelledby="d-title"></dialog>
  <dialog id="settings" aria-labelledby="set-title"></dialog>
  <dialog id="filt-sheet" aria-labelledby="filt-title">
    <div class="fs-head">
      <form method="dialog"><button class="icon-btn" value="close" id="filt-close" aria-label="Zavrieť">×</button></form>
      <h2 id="filt-title">Filtre</h2>
      <button type="button" class="lnk" id="filt-clear" data-clear="all">Zrušiť všetko</button>
    </div>
    <div class="fs-body" id="filt-sheet-body"></div>
    <div class="fs-foot">
      <button type="button" class="btn" id="filt-done">Zobraziť</button>
    </div>
  </dialog>
  <dialog id="ticket-card" aria-labelledby="tc-title"></dialog>
  <dialog id="res-card" aria-labelledby="res-title"></dialog>
  <dialog id="busy" aria-live="assertive" aria-busy="true">
    <div class="busy-spin" aria-hidden="true"></div>
    <p id="busy-label">Načítavam…</p>
  </dialog>
  <div id="toasts" popover="manual" role="status" aria-live="polite"></div>
  <audio id="load-audio" src="loading.mp3" preload="auto" loop></audio>

  <script type="module">
    import { EVENT_ID, API, RES_API, LANE_GAP, ROW_PAD, QR_SCAN_SRC, QR_DRAW_SRC, STAR, EXT } from "./js/config.js";
    import { COPY } from "./js/copy.js";
    import { clampMins, loadFired, saveFired } from "./js/storage.js";
    import { $, esc, wideUi, parts, parseIdt, festDay, minsOnDay, clockLabel, locName, personName, parseMeta, pack, fold, stripTag, stripPart, secColor } from "./js/util.js";
    import { state, t, txt, saveFavs, saveSettings } from "./js/state.js";
    import { withBusy, unlockLoadAudio, toast } from "./js/feedback.js";


    function laneH() {
      return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lane-h")) || 72;
    }




    function filtCount() { return (state.query.trim() ? 1 : 0) + state.selSec.size + state.selVenue.size; }
    function syncFiltUi() {
      const n = filtCount();
      $("filt-sum").textContent = t("filters");
      $("filt-n").hidden = !n;
      $("filt-n").textContent = n;
      $("filt-open").dataset.on = String(n > 0);
      $("filt-clear").hidden = !n;
      $("filt-done").textContent = t("showN")(visibleItems().length);
      document.querySelectorAll("[data-clear='sec']").forEach((b) => { b.hidden = !state.selSec.size; });
      document.querySelectorAll("[data-clear='ven']").forEach((b) => { b.hidden = !state.selVenue.size; });
      renderQHits();
    }
    /* Phones: show matches inside the filter sheet while typing, since the list is hidden behind it. */
    function renderQHits() {
      const box = $("q-hits");
      const q = state.query.trim();
      if (wideUi() || !q) { box.hidden = true; box.innerHTML = ""; return; }
      const hits = state.items.filter(matchesQuery).sort((a, b) => a.start - b.start).slice(0, 12);
      box.hidden = false;
      box.innerHTML = hits.length
        ? hits.map((it) => `<button type="button" class="q-hit" data-id="${it.id}" style="--sec:${secColor(it.section)}">
            <span class="n">${esc(txt(it.raw.NameLocalized))}</span>
            <span class="sub">${esc(dayHeading(it.day))} · ${clockLabel(it.start)} · ${esc(locName(it.loc || {}))}</span>
          </button>`).join("")
        : `<p class="status">${t("emptySearch")}</p>`;
    }
    /* One filter DOM: inline in the header on wide screens, inside the full-screen sheet on phones. */
    function placeFilters() {
      const wide = wideUi();
      const host = wide ? $("filt-inline") : $("filt-sheet-body");
      const body = $("filt-body");
      if (body.parentNode !== host) host.appendChild(body);
      $("filt-inline").hidden = !wide;
      if (wide && $("filt-sheet").open) $("filt-sheet").close();
    }
    function pxMin() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--px-min")) || 2.6; }

    function resTickets() { return state.tickets.filter((tk) => tk.resOn !== false); }
    function resFavsVisible() { return !!(state.onlyFavs && state.favs.size && resTickets().length); }
    function syncResButtons() {
      if (state.onlyFavs) renderMain();
    }
    let remindTimers = [];
    function leadMs() { return state.notifyMins * 60 * 1000; }
    function remindTargets() {
      const now = Date.now();
      const map = new Map();
      const add = (key, start, title, venue, openId, res) => {
        if (start.getTime() <= now) return;
        const prev = map.get(key);
        if (!prev) map.set(key, { key, start, title, venue, openId, res, at: start.getTime() - leadMs() });
        else if (res) prev.res = true;
      };
      if (state.notifyFav) {
        for (const it of state.items) {
          if (!state.favs.has(it.id)) continue;
          add("i" + it.id, it.start, txt(it.raw.NameLocalized), locName(it.loc || {}), it.id, false);
        }
      }
      if (state.notifyRes) {
        for (const tk of state.tickets) {
          const pass = state.resPass.get(tk.payload);
          if (!pass || !pass.ok) continue;
          for (const e of reservedEvents(pass)) {
            const it = matchSchedule(e);
            add(it ? "i" + it.id : "r" + e.TicketDateId, e.start, e.Name, e.venueName || "", it ? it.id : null, true);
          }
        }
      }
      return [...map.values()];
    }
    async function fireRemind(x) {
      if (!state.notifyOn || typeof Notification === "undefined" || Notification.permission !== "granted") return;
      if (x.start.getTime() <= Date.now()) return;
      const fired = loadFired();
      if (fired[x.key]) return;
      fired[x.key] = Date.now();
      saveFired(fired);
      const mins = Math.max(1, Math.round((x.start.getTime() - Date.now()) / 60000));
      const kind = x.res ? t("notifyRes") : t("notifyFav");
      const opts = {
        body: t("notifyBody")(mins, x.venue || "", kind),
        tag: "cm-" + x.key,
        lang: state.lang,
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        data: { id: x.openId },
      };
      try {
        const reg = navigator.serviceWorker && await navigator.serviceWorker.ready;
        if (reg) await reg.showNotification(x.title || t("name"), opts);
        else new Notification(x.title || t("name"), opts);
      } catch {}
    }
    async function scheduleReminders() {
      remindTimers.forEach(clearTimeout);
      remindTimers = [];
      if (!state.notifyOn || typeof Notification === "undefined" || Notification.permission !== "granted") return;
      if (state.notifyRes && state.tickets.length) await Promise.allSettled(state.tickets.map(loadResPass));
      const now = Date.now();
      const fired = loadFired();
      for (const x of remindTargets()) {
        const delay = x.at - now;
        if (delay <= 0) {
          if (!fired[x.key]) void fireRemind(x);
          continue;
        }
        if (delay > 8 * 86400000) continue;
        remindTimers.push(setTimeout(() => { void fireRemind(x); }, Math.min(delay, 2147483647)));
      }
    }
    function goFilm(id) {
      const n = Number(id);
      if (!Number.isFinite(n)) return;
      state.pendingFilm = n;
      const it = state.items.find((x) => x.id === n);
      if (!it) return;
      state.pendingFilm = null;
      if (it.day !== state.day) { state.day = it.day; paint(); }
      openDetail(n);
    }
    async function setNotify(on) {
      const note = (msg) => {
        const el = $("notify-status");
        if (!el) return;
        el.hidden = !msg;
        el.textContent = msg || "";
      };
      if (on) {
        if (typeof Notification === "undefined") {
          state.notifyOn = false;
          saveSettings();
          note(t("notifyNo"));
          return;
        }
        let perm = Notification.permission;
        if (perm === "default") perm = await Notification.requestPermission();
        if (perm !== "granted") {
          state.notifyOn = false;
          saveSettings();
          note(t("notifyDenied"));
          const box = document.querySelector("[data-notify]");
          if (box) box.checked = false;
          return;
        }
      }
      state.notifyOn = on;
      saveSettings();
      note("");
      void scheduleReminders();
    }
    function namesMatch(a, b) {
      a = fold(stripTag(a)).replace(/^the /, "");
      b = fold(stripTag(b)).replace(/^the /, "");
      if (!a || !b) return false;
      if (a === b) return true;
      if ((a.startsWith(b) || b.startsWith(a)) && Math.min(a.length, b.length) >= 10) return true;
      const aw = a.split(" ").filter((w) => w.length > 1);
      const bw = b.split(" ").filter((w) => w.length > 1);
      return aw.filter((w) => bw.includes(w)).length >= 2;
    }
    function flattenRes(data, ident) {
      const out = [];
      for (const v of data.Venues || []) {
        for (const e of v.Events || []) {
          if (ident && fold(e.TicketIdentifier || "") !== fold(ident)) continue;
          out.push({ ...e, venueName: v.LocationName || v.Name, start: parseIdt(e.StartDate), end: parseIdt(e.EndDate) });
        }
      }
      return out;
    }
    function sameScreening(it, ev) {
      const nl = it.raw.NameLocalized || {};
      return it.start.getTime() === ev.start.getTime()
        && (namesMatch(nl.English, ev.Name) || namesMatch(nl.Slovak, ev.Name));
    }
    function matchResEvent(it, events) {
      const hits = events.filter((e) => sameScreening(it, e));
      if (hits.length <= 1) return hits[0] || null;
      const loc = fold(locName(it.loc || {}));
      return hits.find((e) => fold(e.venueName || "").includes(loc) || loc.includes(fold(e.venueName || ""))) || hits[0];
    }
    function resErr(code) { return t("resR" + code) || t("resFail"); }
    async function resGet(path, params) {
      const u = new URL(RES_API + path);
      for (const [k, v] of Object.entries(params)) if (v != null && v !== "") u.searchParams.set(k, v);
      const res = await fetch(u, { signal: AbortSignal.timeout(15000) });
      if (!res.ok) throw new Error(String(res.status));
      return res.json();
    }
    async function resPost(path, body) {
      const res = await fetch(RES_API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify(body),
        signal: AbortSignal.timeout(15000),
      });
      if (!res.ok) throw new Error(String(res.status));
      return res.json();
    }
    async function loadResPub() {
      if (state.resPub && Date.now() - state.resPub.at < 120000) return state.resPub;
      const data = await resGet("FetchReservationData", { EventId: EVENT_ID, Language: state.lang === "en" ? 2 : 1 });
      const seen = new Set();
      const events = [];
      for (const e of flattenRes(data, null)) {
        const k = e.start.getTime() + "|" + fold(e.Name) + "|" + fold(e.venueName);
        if (seen.has(k)) continue;
        seen.add(k);
        events.push(e);
      }
      state.resPub = { at: Date.now(), events };
      return state.resPub;
    }
    async function loadResPass(tk) {
      const id = tk.payload;
      const prev = state.resPass.get(id);
      if (prev && Date.now() - prev.at < 12000) return prev;
      const data = await resGet("FetchReservationData", { EventId: EVENT_ID, CheckingId: id, Language: state.lang === "en" ? 2 : 1 });
      const tns = (data.UserData && data.UserData.TicketNumbers) || [];
      const row = tns.find((x) => x.CheckingId === id) || tns[0];
      const rec = {
        at: Date.now(), data, ok: !!row,
        ident: row ? row.TicketIdentifier : "",
        tnId: row ? row.TicketNumberId : null,
        events: flattenRes(data, row ? row.TicketIdentifier : "\0"),
      };
      state.resPass.set(id, rec);
      return rec;
    }
    function reservedEvents(pass) {
      const ids = new Set(((pass.data && pass.data.UserTickets) || []).map((u) => u.TicketDateId));
      return pass.events.filter((e) => ids.has(e.TicketDateId)).sort((a, b) => a.start - b.start);
    }
    function matchSchedule(ev) {
      return state.items.find((it) => sameScreening(it, ev));
    }
    function resCardHtml(title, body) {
      return `
        <form method="dialog"><button class="x" value="close" aria-label="${t("close")}">×</button></form>
        <div class="panel-body">
          <h2 id="res-title" tabindex="-1">${title}</h2>
          ${body}
        </div>`;
    }
    async function openMine() {
      const c = COPY[state.lang];
      if (!state.tickets.length) {
        $("res-card").innerHTML = resCardHtml(c.resMine, `
          <p class="status">${c.resNoPass}</p>
          <div class="detail-actions">
            <button type="button" class="btn" data-res-need>${c.addTicket}</button>
            <button type="button" class="btn secondary" data-close>${c.close}</button>
          </div>`);
        $("res-card").showModal();
        return;
      }
      $("res-card").innerHTML = resCardHtml(c.resMine, `<p class="status">${c.load}</p>`);
      $("res-card").showModal();
      $("res-title").focus();
      await withBusy(c.load, async () => {
        for (const tk of state.tickets) state.resPass.delete(tk.payload);
        await Promise.allSettled(state.tickets.map(loadResPass));
      });
      if (!$("res-card").open) return;
      let body = "";
      for (const tk of state.tickets) {
        const pass = state.resPass.get(tk.payload);
        const evs = pass && pass.ok ? reservedEvents(pass) : [];
        body += `<h3>${esc(tk.name)}</h3>`;
        if (!pass || !pass.ok) body += `<p class="status">${c.resBadPass}</p>`;
        else if (!evs.length) body += `<p class="status">${c.resMineEmpty}</p>`;
        else body += evs.map((e) => {
          const it = matchSchedule(e);
          return `<div class="list-item" style="--sec:var(--accent)">
            <button type="button" class="block-hit list-hit"${it ? ` data-res-open="${it.id}"` : " disabled"}>
              <span class="when">${clockLabel(e.start)}</span>
              <span><span class="n">${esc(e.Name)}</span><span class="sub">${esc(dayHeading(festDay(e.start)))} · ${esc(e.venueName || "")}</span></span>
            </button>
            <button type="button" class="ghost" data-unres-tk="${esc(tk.id)}" data-td="${e.TicketDateId}">${c.resUnres}</button>
          </div>`;
        }).join("");
      }
      $("res-card").innerHTML = resCardHtml(c.resMine, `${body}<button type="button" class="btn secondary" data-close>${c.close}</button>`);
      $("res-title").focus();
    }
    async function unresMine(tkId, td) {
      const tk = state.tickets.find((x) => x.id === tkId);
      if (!tk) return;
      const r = await withBusy(t("resBusy"), async () => {
        const pass = await loadResPass(tk);
        const out = await resPost("UnreserveTicket", { CheckingId: tk.payload, TicketDateId: Number(td), TicketNumberId: pass.tnId });
        state.resPass.delete(tk.payload);
        return out;
      });
      if (r.Result !== 0) { toast(resErr(r.Result)); return; }
      void scheduleReminders();
      void openMine();
    }

    function isReserved(pass, ev) {
      return ((pass.data && pass.data.UserTickets) || []).some((u) => u.TicketDateId === ev.TicketDateId);
    }
    /* Reservation controls in the detail modal: labelled by action, state shown as text beside them. */
    function resArea(it) {
      const pub = state.resPub && matchResEvent(it, state.resPub.events);
      if (!pub) return "";
      const tks = resTickets();
      if (!tks.length) {
        return `<button type="button" class="btn secondary" data-res-need>${t("resNeed")}</button><p class="res-hint">${t("resNeedHint")}</p>`;
      }
      let reserved = 0, known = 0;
      for (const tk of tks) {
        const pass = state.resPass.get(tk.payload);
        if (!pass || !pass.ok) continue;
        known += 1;
        const ev = matchResEvent(it, pass.events);
        if (ev && isReserved(pass, ev)) reserved += 1;
      }
      const cap = pub.TicketsRemaining > 9900 ? "" : ` · ${t("resFree")(pub.TicketsRemaining)}`;
      const who = tks.length === 1 ? esc(tks[0].name) : t("resPasses")(tks.length);
      if (known && reserved === tks.length) {
        return `<span class="res-state">${t("resDone")}</span>
          <button type="button" class="btn secondary" id="res-chip" data-unres="${it.id}">${t("resUnres")}</button>

    function setResMsg(text) {

    async function bookOne(tk, it, unres) {
      const pass = await loadResPass(tk);
      if (!pass.ok) return { tk, ok: false, msg: t("resBadPass") };
      const ev = matchResEvent(it, pass.events);
      if (!ev) return { tk, ok: false, msg: t("resNo") };
      if (!unres && isReserved(pass, ev)) return { tk, ok: true, skip: true, msg: t("resSkip") };
      if (unres && !isReserved(pass, ev)) return { tk, ok: true, skip: true, msg: t("resSkip") };
      const r = await resPost(unres ? "UnreserveTicket" : "ReserveTicket", {
        CheckingId: tk.payload, TicketDateId: ev.TicketDateId, TicketNumberId: pass.tnId,
      });
      state.resPass.delete(tk.payload);
      if (r.Result === 0) return { tk, ok: true, msg: unres ? t("resUnresOk") : t("resOk") };
      return { tk, ok: false, msg: resErr(r.Result) };
    }
    async function bookItem(it, unres) {
      const tks = resTickets();
      if (!tks.length) { void openSettings(); return; }
      if (unres && !confirm(t("resUnresAsk"))) return;
      const chip = $("res-chip");
      if (chip) { chip.disabled = true; chip.setAttribute("aria-busy", "true"); }
      setResMsg(t("resBusy"));
      const rows = [];
      let ok = 0;
      await withBusy(t("resBusy"), async () => {
        for (const tk of tks) {
          try {
            const r = await bookOne(tk, it, unres);
            if (r.ok && !r.skip) ok += 1;
            rows.push(`${tk.name}: ${r.msg}`);
          } catch {
            rows.push(`${tk.name}: ${t("resFail")}`);
          }
        }
        await refreshResChip(it);
      });
      setResMsg(ok ? (unres ? t("resUnresOk") : t("resOk")) : (rows[0] || t("resFail")));
      if (tks.length > 1) showResLog(rows);
      void scheduleReminders();
    }
    async function bookFavs() {
      const tks = resTickets();
      const items = state.items.filter((it) => state.favs.has(it.id));
      if (!tks.length) { void openSettings(); return; }
      if (!items.length) return;
      if (!confirm(t("resFavAsk")(items.length, tks.length))) return;
      if ($("btn-res-favs")) $("btn-res-favs").disabled = true;
      const rows = [];
      let ok = 0;
      await withBusy(t("resBusy"), async () => {
        try { await loadResPub(); } catch {}
        for (const it of items.sort((a, b) => a.start - b.start)) {
          const title = txt(it.raw.NameLocalized);
          if (state.resPub && !matchResEvent(it, state.resPub.events)) {
            rows.push(`${title}: ${t("resNo")}`);
            continue;
          }
          for (const tk of tks) {
            try {
              const r = await bookOne(tk, it, false);
              if (r.ok && !r.skip) ok += 1;
              rows.push(`${tk.name} · ${title}: ${r.msg}`);
            } catch {
              rows.push(`${tk.name} · ${title}: ${t("resFail")}`);
            }
          }
        }
      });
      if ($("btn-res-favs")) $("btn-res-favs").disabled = false;
      toast(ok ? t("resOk") : t("resFail"));
      showResLog(rows);
      void scheduleReminders();
    }

    function hydrate(data) {
      const people = new Map((data.Persons || []).map((p) => [p.Id, p]));
      const locById = new Map((data.Locations || []).map((l) => [l.Id, l]));
      state.venues = [...(data.Locations || [])];
      const secSet = new Map();
      state.items = (data.Schedules || []).map((s) => {
        const start = parseIdt(s.StartTime);
        const end = parseIdt(s.EndTime);
        const sp = (s.Persons || [])[0];
        const person = sp ? people.get(sp.TicketNumberId) : null;
        const section = person ? personName(person) : "";
        if (section) secSet.set(section, 1);
        return { id: s.Id, raw: s, start, end, loc: locById.get(s.LocationId), locationId: s.LocationId, section, day: festDay(start) };
      });
      state.sections = [...secSet.keys()];
      const days = [...new Set(state.items.map((i) => i.day))].sort();
      const nowKey = festDay(new Date());
      state.day = days.includes(nowKey) ? nowKey : days[0];
    }

    function chips(list, key, sel, colorFn, counts) {
      return list.map((item) => {
        const id = item.id ?? item;
        const name = item.name ?? item;
        const on = sel.has(String(id));
        const color = colorFn ? `style="--sec:${colorFn(name)}"` : "";
        const dot = colorFn ? `<span class="dot" ${color}></span>` : "";
        const n = counts.get(String(id)) || 0;
        return `<button type="button" class="chip" data-${key}="${esc(String(id))}" aria-pressed="${on}">${dot}<span class="chip-t">${esc(name)}</span><span class="cnt${n ? "" : " is-zero"}">${n}</span></button>`;
      }).join("");
    }
    function filterGroup(id, label, key, body) {
      $(id).hidden = !body;
      $(id).innerHTML = body
        ? `<div class="grp-head"><span class="lbl">${label}</span><button type="button" class="lnk" data-clear="${key}" hidden>${t("clearSel")}</button></div><div class="opts">${body}</div>`
        : "";
    }
    function dayCounts(pick) {
      const m = new Map();
      for (const it of state.items) {
        if (it.day !== state.day) continue;
        const k = String(pick(it));
        m.set(k, (m.get(k) || 0) + 1);
      }
      return m;
    }

    function matchesQuery(it) {

    function renderBoard() {
      const items = visibleItems();
      $("status").textContent = COPY[state.lang].films(items.length);
      if (!items.length) {
        renderEmpty();
        return;
      }
      const PX = pxMin();
      const LH = laneH();
      const byVenue = new Map(state.venues.map((v) => [v.Id, []]));
      for (const it of items) if (byVenue.has(it.locationId)) byVenue.get(it.locationId).push(it);

      let axisStart = Infinity, axisEnd = 26 * 60;
      for (const it of items) {
        axisStart = Math.min(axisStart, minsOnDay(it.start, it.day));
        axisEnd = Math.max(axisEnd, minsOnDay(it.end, it.day));
      }
      axisStart = Math.max(0, Math.floor(axisStart / 60) * 60);
      axisEnd = Math.ceil(axisEnd / 60) * 60;
      state.axisStart = axisStart;
      const width = (axisEnd - axisStart) * PX;

      const hours = [];
      for (let m = axisStart; m < axisEnd; m += 60) {
        const clock = ((m / 60) % 24 + 24) % 24;
        hours.push(`<span class="${m >= 24 * 60 ? "next-cal" : ""}">${String(clock).padStart(2, "0")}:00</span>`);
      }

      const rows = [];
      const gutter = [];
      /* On phones the gutter is hidden and the venue name sits in a strip at the top of each lane. */
      const compact = !wideUi();
      const padTop = compact ? 22 : ROW_PAD;
      const padBot = compact ? 6 : ROW_PAD;
      for (const loc of state.venues) {
        const list = byVenue.get(loc.Id) || [];
        if (!list.length) continue;
        const nLanes = pack(list);
        const h = padTop + padBot + nLanes * LH + (nLanes - 1) * LANE_GAP;
        const blocks = list.map((it) => {
          const a = minsOnDay(it.start, it.day);
          const b = minsOnDay(it.end, it.day);
          const left = (a - axisStart) * PX;
          const w = Math.max((b - a) * PX, 8);
          const top = padTop + it.lane * (LH + LANE_GAP);
          const title = txt(it.raw.NameLocalized);
          const st = clockLabel(it.start), en = clockLabel(it.end);
          const on = state.favs.has(it.id);
          return `<div class="block${w < 110 ? " tight" : ""}${on ? " is-fav" : ""}" data-id="${it.id}"
            style="left:${left}px;width:${w}px;top:${top}px;height:${LH}px;--sec:${secColor(it.section)}">
            <button type="button" class="block-hit" data-id="${it.id}"
              aria-label="${st}–${en}, ${esc(title)}, ${esc(locName(loc))}">
              <span class="inner">
                <span class="t">${st}–${en}</span>
                <span class="n">${esc(title)}</span>
                <span class="s">${esc(it.section)}</span>
              </span>
            </button>
            <button type="button" class="fav" data-fav="${it.id}" aria-pressed="${on}" aria-label="${on ? t("favRemove") : t("favAdd")}">${STAR}</button>
          </div>`;
        }).join("");
        const laneName = compact ? `<span class="lane-name">${esc(locName(loc))} <small>${list.length}</small></span>` : "";
        rows.push(`<div class="lane" style="width:${width}px;height:${h}px">${laneName}${blocks}</div>`);
        gutter.push(`<div class="venue" style="height:${h}px"><strong>${esc(locName(loc))}</strong><small>${list.length}</small></div>`);
      }

      $("main").innerHTML = `<div class="board-split">
        <aside class="gutter" id="gutter">
          <div class="corner">${t("halls")}</div>
          ${gutter.join("")}
        </aside>
        <div class="board" id="board" tabindex="-1">
          <div class="sheet" id="sheet">
            <div class="hour-track" style="width:${width}px">${hours.join("")}</div>
            ${rows.join("")}
            <div class="now-line" id="now-line" hidden></div>
          </div>
        </div>
      </div>`;

      placeNow();
      const board = $("board");
      const side = $("gutter");
      let lock = false;
      const link = (a, b) => {
        a.addEventListener("scroll", () => {
          if (lock) return;
          lock = true;
          b.scrollTop = a.scrollTop;
          if (a === board) pinTitles();
          lock = false;
        }, { passive: true });
      };
      link(board, side);
      link(side, board);
      /* Land on the first screening, or on "now" while today's programme is running. */
      const starts = items.map((it) => minsOnDay(it.start, it.day));
      const nowD = new Date();
      let focus = Math.min(...starts);
      if (festDay(nowD) === state.day) focus = Math.min(Math.max(focus, minsOnDay(nowD, state.day)), Math.max(...starts));
      board.scrollLeft = Math.max(0, (focus - 15 - axisStart) * PX);
      side.style.paddingBottom = Math.max(0, board.offsetHeight - board.clientHeight) + "px";
      pinTitles();
    }

    function pinTitles() {
      const board = $("board");
      if (!board) return;
      const sl = board.scrollLeft;
      for (const el of board.querySelectorAll(".lane-name")) el.style.transform = sl ? `translateX(${sl}px)` : "";
      for (const el of board.querySelectorAll(".block")) {
        const inner = el.querySelector(".inner");
        if (!inner) continue;
        const left = parseFloat(el.style.left) || 0;
        const under = sl - left;
        const pad = Math.max(0, Math.min(under, el.offsetWidth - 72));
        inner.style.transform = pad ? `translateX(${pad}px)` : "";
      }
    }

    function placeNow() {
      const line = $("now-line");
      if (!line) return;
      const now = new Date();
      if (festDay(now) !== state.day) { line.hidden = true; return; }
      const x = (minsOnDay(now, state.day) - state.axisStart) * pxMin();
      line.style.left = x + "px";
      line.hidden = x < 0;
    }

    const rateCache = new Map();
    let rateSeq = 0;

    async function getJson(url) {
      const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }
    function claimVal(claims, p) {
      const v = ((claims[p] || [])[0] || {}).mainsnak;
      return v && v.datavalue ? v.datavalue.value : null;
    }
    function p444(claims, org) {
      for (const st of claims.P444 || []) {
        const q = ((((st.qualifiers || {}).P447 || [])[0] || {}).datavalue || {}).value;
        if ((q && q.id) !== org) continue;
        const v = (st.mainsnak && st.mainsnak.datavalue && st.mainsnak.datavalue.value) || "";
        return String(v);
      }
      return "";
    }
    async function wdFind(titles, year) {
      for (const title of titles) {
        const d = await getJson("https://www.wikidata.org/w/api.php?action=wbsearchentities&search=" + encodeURIComponent(title) + "&language=en&type=item&limit=8&format=json&origin=*");
        const ids = (d.search || []).map((x) => x.id).filter(Boolean);
        if (!ids.length) continue;
        const e = await getJson("https://www.wikidata.org/w/api.php?action=wbgetentities&ids=" + encodeURIComponent(ids.join("|")) + "&props=claims&format=json&origin=*");
        let fallback = null;
        for (const id of ids) {
          const claims = (e.entities[id] || {}).claims || {};
          const imdb = claimVal(claims, "P345");
          const csfd = claimVal(claims, "P2529");
          if (!imdb && !csfd) continue;
          const time = claimVal(claims, "P577");
          const wy = time && time.time ? +time.time.slice(1, 5) : 0;
          const rec = { imdb, csfd, imdbScore: p444(claims, "Q37312"), csfdScore: p444(claims, "Q3561957") };
          if (year && wy && Math.abs(wy - year) > 2) continue;
          if (year && wy && Math.abs(wy - year) <= 2) return rec;
          if (!fallback) fallback = rec;
        }
        if (fallback) return fallback;
      }
      return {};
    }
    async function cinemetaFind(titles, year) {
      for (const title of titles) {
        const d = await getJson("https://v3-cinemeta.strem.io/catalog/movie/top/search=" + encodeURIComponent(title) + ".json");
        const ft = fold(title);
        const metas = d.metas || [];
        const score = (m) => {
          const n = fold(m.name);
          const y = parseInt(String(m.releaseInfo || m.year || ""), 10) || 0;
          let s = n === ft ? 4 : (n.includes(ft) || ft.includes(n) ? 2 : 0);
          if (year && y && Math.abs(y - year) <= 1) s += 2;
          return s;
        };
        const hit = metas.map((m) => ({ m, s: score(m) })).filter((x) => x.s >= 2).sort((a, b) => b.s - a.s)[0];
        const id = hit && (hit.m.imdb_id || hit.m.id);
        if (!id || !/^tt\d+$/.test(id)) continue;
        const meta = await getJson("https://cinemeta-live.strem.io/meta/movie/" + id + ".json");
        const rating = meta.meta && meta.meta.imdbRating;
        return { id, rating: rating && rating !== "N/A" ? String(rating) : "" };
      }
      return {};
    }
    /* With a value it reads as a rating; without one it is plainly a link to search the site. */
    function rateChip(label, href, val) {
      return `<a class="rate${val ? "" : " is-link"}" href="${esc(href)}" target="_blank" rel="noopener">${label}${val ? ` <b>${esc(val)}</b>` : EXT}</a>`;
    }
    function fmtCsfd(s) {
      const raw = String(s || "").trim();
      if (!raw) return "";
      if (/%/.test(raw)) return raw;
      const n = parseFloat(raw.replace(",", "."));
      if (Number.isFinite(n) && n <= 100) return (Number.isInteger(n) ? n : n.toFixed(1)) + "%";
      return raw;
    }
    async function wdByImdb(imdbId) {
      if (!/^tt\d+$/.test(imdbId)) return {};
      const query = `SELECT ?csfd ?csfdScore ?imdbScore WHERE {
        ?item wdt:P345 "${imdbId}".
        OPTIONAL { ?item wdt:P2529 ?csfd. }
        OPTIONAL { ?item p:P444 ?c. ?c ps:P444 ?csfdScore. ?c pq:P447 wd:Q3561957. }
        OPTIONAL { ?item p:P444 ?i. ?i ps:P444 ?imdbScore. ?i pq:P447 wd:Q37312. }
      } LIMIT 1`;
      const d = await getJson("https://query.wikidata.org/sparql?query=" + encodeURIComponent(query) + "&format=json");
      const b = ((d.results || {}).bindings || [])[0] || {};
      const lit = (k) => (b[k] && b[k].value) || "";
      return { imdb: imdbId, csfd: lit("csfd"), csfdScore: lit("csfdScore"), imdbScore: lit("imdbScore") };
    }
    async function lookupRatings(q) {
      const titles = [...new Set([q.orig, q.en, q.sk].map(stripPart).filter((x) => x.length > 1))];
      const qstr = q.orig || q.en || q.sk;
      const im = await cinemetaFind(titles, q.year).catch(() => ({}));
      let wd = {};
      if (im.id) wd = await wdByImdb(im.id).catch(() => ({}));
      if (!wd.csfd) {
        const byName = await wdFind(titles, q.year).catch(() => ({}));
        wd = {
          imdb: wd.imdb || byName.imdb,
          csfd: wd.csfd || byName.csfd,
          csfdScore: wd.csfdScore || byName.csfdScore,
          imdbScore: wd.imdbScore || byName.imdbScore,
        };
      }
      const imdbId = im.id || wd.imdb || "";
      let imdb = im.rating || "";
      if (!imdb && wd.imdbScore) imdb = String(wd.imdbScore).replace(/\s*\/\s*10\s*$/, "");
      if (!imdb && imdbId && !im.rating) {
        try {
          const meta = await getJson("https://cinemeta-live.strem.io/meta/movie/" + imdbId + ".json");
          const r = meta.meta && meta.meta.imdbRating;
          if (r && r !== "N/A") imdb = String(r);
        } catch {}
      }
      return { q: qstr, imdbId, imdb, csfdId: wd.csfd || "", csfd: fmtCsfd(wd.csfdScore) };
    }
    function matchFilmRow(q) {
      const sk = fold(stripPart(q.sk));
      const en = fold(stripPart(q.en));
      return (state.filmLinks || []).find((f) => (sk && fold(f.sk) === sk) || (en && f.en && fold(f.en) === en));
    }
    async function fillRatings(it, meta) {
      const seq = ++rateSeq;
      const box = $("ratings");
      if (!box) return;
      const names = it.raw.NameLocalized || {};
      const q = { en: names.English || "", sk: names.Slovak || "", orig: meta.orig || "", year: meta.year || 0 };
      const key = [q.orig, q.en, q.sk, q.year].join("|");
      const render = (d) => {
        if (seq !== rateSeq || !$("ratings")) return;
        const qenc = encodeURIComponent(d.q || q.en || q.sk);
        const imdbHref = d.imdbHref || (d.imdbId ? "https://www.imdb.com/title/" + d.imdbId + "/" : "https://www.imdb.com/find/?q=" + qenc);
        const csfdHref = d.csfdHref || (d.csfdId ? "https://www.csfd.cz/film/" + d.csfdId : "https://www.csfd.cz/hledat/?q=" + qenc);
        $("ratings").innerHTML = rateChip("IMDb", imdbHref, d.imdb) + rateChip("ČSFD", csfdHref, d.csfd);
      };
      if (rateCache.has(key)) { render(rateCache.get(key)); return; }
      try {
        const d = await withBusy(t("rateWait"), async () => {
          const row = matchFilmRow(q);
          if (row && (row.imdb || row.csfd)) {
            const imdbId = ((row.imdb || "").match(/tt\d+/) || [])[0] || "";
            let rating = "";
            if (imdbId) {
              try {
                const live = await getJson("https://cinemeta-live.strem.io/meta/movie/" + imdbId + ".json");
                const r = live.meta && live.meta.imdbRating;
                if (r && r !== "N/A") rating = String(r);
              } catch {}
            }
            return { q: q.orig || q.en || q.sk, imdb: rating, csfd: "", imdbHref: row.imdb, csfdHref: row.csfd };
          }
          return lookupRatings(q);
        });
        rateCache.set(key, d);
        render(d);
      } catch {
        if (seq !== rateSeq || !$("ratings")) return;
        const qenc = encodeURIComponent(q.orig || q.en || q.sk);
        $("ratings").innerHTML = rateChip("IMDb", "https://www.imdb.com/find/?q=" + qenc, "") + rateChip("ČSFD", "https://www.csfd.cz/hledat/?q=" + qenc, "");
      }
    }

      const s = it.raw;

      const meta = parseMeta(desc);

      const orig = meta.orig && meta.orig.toLowerCase() !== title.toLowerCase() ? `<p class="orig">${esc(meta.orig)}</p>` : "";
      const runtime = meta.runtime || Math.round((it.end - it.start) / 60000);
      const on = state.favs.has(it.id);
      const trailer = s.VideoUrl

    function toggleFav(id) {
      if (state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
      saveFavs();
      const on = state.favs.has(id);
      document.querySelectorAll(`[data-fav="${id}"]`).forEach((b) => {

        if (b.classList.contains("fav")) b.setAttribute("aria-label", on ? t("favRemove") : t("favAdd"));
      });
      document.querySelectorAll(`.block[data-id="${id}"]`).forEach((b) => b.classList.toggle("is-fav", on));

      toast(on ? t("favAdded") : t("favRemoved"));
      void scheduleReminders();

    let scanner = null;
    let pendingQr = null;

    function loadScript(src, ready) {
      return new Promise((resolve, reject) => {
        if (ready()) return resolve();
        const el = document.createElement("script");
        el.src = src;
        el.async = true;
        el.onload = () => (ready() ? resolve() : reject(new Error("lib")));
        el.onerror = () => reject(new Error("net"));
        document.head.appendChild(el);
      });
    }

    async function stopScan() {
      if (!scanner) return;
      try { await scanner.stop(); } catch {}
      try { scanner.clear(); } catch {}
      scanner = null;
    }

    function revealScan() {
      const panel = $("scan-panel");
      if (!panel) return;
      panel.hidden = false;
      $("scan-save").hidden = true;
      pendingQr = null;
    }

    async function startCam() {
      revealScan();
      const status = $("scan-status");
      if (!status || !$("qr-box")) return;
      status.textContent = t("scanLib");
      try {
        await withBusy(t("scanLib"), () => loadScript(QR_SCAN_SRC, () => typeof Html5Qrcode === "function"));
      } catch {
        status.textContent = t("scanFail");
        return;
      }
      const host = location.hostname;
      const ok = location.protocol === "https:" || host === "localhost" || host === "127.0.0.1";
      if (!ok) {
        status.textContent = t("scanNeedHttps");
        return;
      }
      await stopScan();
      scanner = new Html5Qrcode("qr-box", { verbose: false });
      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 8, qrbox: { width: 220, height: 220 } },
          (text) => { onScanned(text); },
          () => {}
        );
        status.textContent = "";
      } catch {
        status.textContent = t("scanFail");
        scanner = null;
      }
    }

    async function decodeQrFile(file) {
      if (typeof BarcodeDetector === "function") {
        try {
          const det = new BarcodeDetector({ formats: ["qr_code"] });
          const bmp = await createImageBitmap(file);
          const found = await det.detect(bmp);
          if (typeof bmp.close === "function") bmp.close();
          if (found[0] && found[0].rawValue) return found[0].rawValue;
        } catch {}
      }
      await loadScript(QR_SCAN_SRC, () => typeof Html5Qrcode === "function");
      await stopScan();
      scanner = new Html5Qrcode("qr-box", { verbose: false });
      const text = await scanner.scanFile(file, true);
      await stopScan();
      return text;
    }

    async function scanFile(file) {
      revealScan();
      const status = $("scan-status");
      if (!status) return;
      status.textContent = t("scanLib");
      await stopScan();
      try {
        const text = await withBusy(t("scanLib"), () => decodeQrFile(file));
        if (!String(text || "").trim()) throw new Error("empty");
        onScanned(text);
      } catch {
        status.textContent = t("scanNoQr");
        scanner = null;
      }
    }

    function onScanned(text) {
      const payload = String(text || "").trim();
      if (!payload) return;
      pendingQr = payload;
      void stopScan();
      const save = $("scan-save");
      const status = $("scan-status");
      const name = $("new-ticket-name");
      if (save) save.hidden = false;
      if (status) status.textContent = t("scanOk");
      if (name) {
        name.value = `${t("ticketSel")} ${state.tickets.length + 1}`;
        name.focus();
        name.select();
      }
    }

    function savePendingTicket() {
      if (!pendingQr) return;
      const name = ($("new-ticket-name")?.value || "").trim() || `${t("ticketSel")} ${state.tickets.length + 1}`;
      const id = (crypto.randomUUID && crypto.randomUUID()) || ("t" + Date.now());
      state.tickets.push({ id, name, payload: pendingQr, addedAt: Date.now(), resOn: true });
      state.activeTicketId = id;
      pendingQr = null;
      saveSettings();
      syncResButtons();
      void openSettings();
      toast(t("ticketSaved"));
    }

    /* Deleting is immediate but undoable from the toast; the QR would otherwise have to be re-scanned. */
    function deleteTicket(id) {
      const idx = state.tickets.findIndex((x) => x.id === id);
      if (idx < 0) return;
      const tk = state.tickets[idx];
      const wasActive = state.activeTicketId === id;
      state.tickets.splice(idx, 1);
      if (wasActive) state.activeTicketId = state.tickets[0]?.id || null;
      saveSettings();
      syncResButtons();
      if ($("settings").open) void openSettings();
      toast(t("ticketDeleted"), { label: t("undo"), run: () => {
        state.tickets.splice(Math.min(idx, state.tickets.length), 0, tk);
        if (wasActive) state.activeTicketId = tk.id;
        saveSettings();
        syncResButtons();
        if ($("settings").open) void openSettings();
      } });
    }

    function setActiveTicket(id) {
      if (!state.tickets.some((tk) => tk.id === id)) return;
      state.activeTicketId = id;
      saveSettings();
      document.querySelectorAll("[data-ticket-row]").forEach((row) => {
        row.classList.toggle("is-on", row.dataset.ticketRow === id);
      });
    }

    async function showTicket(id) {
      const tk = state.tickets.find((x) => x.id === (id || state.activeTicketId));
      if (!tk) return;
      setActiveTicket(tk.id);
      const reopen = $("settings").open;
      if (reopen) $("settings").close();
      const card = $("ticket-card");
      card.innerHTML = `
        <form method="dialog"><button class="x" value="close" aria-label="${t("close")}">×</button></form>
        <div class="panel-body">
          <h2 id="tc-title" tabindex="-1">${esc(tk.name)}</h2>
          <div class="qr-show"><canvas id="qr-canvas" width="280" height="280"></canvas></div>
          <button type="button" class="btn secondary" data-close>${t("close")}</button>
        </div>`;
      card.showModal();
      $("tc-title").focus();
      const canvas = $("qr-canvas");
      try {
        await withBusy(t("load"), async () => {
          await loadScript(QR_DRAW_SRC, () => typeof QRCode !== "undefined" && typeof QRCode.toCanvas === "function");
          await QRCode.toCanvas(canvas, String(tk.payload), { width: 280, margin: 2, errorCorrectionLevel: "M", color: { dark: "#000000", light: "#ffffff" } });
        });
      } catch {
        /* No remote fallback: the pass must never leave the phone except to Inviton. */
        const box = card.querySelector(".qr-show");
        if (box) box.innerHTML = `<p class="qr-payload">${esc(t("qrFail"))}<br><b>${esc(tk.payload)}</b></p>`;
      }
      if (reopen) card.addEventListener("close", () => { void openSettings(); }, { once: true });
    }

    function paint() { renderChrome(); renderMain(); }

    document.addEventListener("click", (e) => {
      const tab = e.target.closest("[data-day]");
      if (tab) { state.day = tab.dataset.day; paint(); return; }
      const langBtn = e.target.closest("#lang-sk, #lang-en");
      if (langBtn) {
        state.lang = langBtn.id === "lang-en" ? "en" : "sk";
        document.documentElement.lang = state.lang;
        saveSettings();
        paint();
        if ($("settings").open) void openSettings();
        return;
      }
      const clear = e.target.closest("[data-clear]");
      if (clear) {
        const what = clear.dataset.clear;
        if (what === "sec" || what === "all") state.selSec.clear();
        if (what === "ven" || what === "all") state.selVenue.clear();
        if (what === "q" || what === "all") { state.query = ""; $("q").value = ""; }
        paint(); return;
      }
      const sec = e.target.closest("[data-sec]");
      if (sec) {
        const name = sec.dataset.sec;
        if (state.selSec.has(name)) state.selSec.delete(name); else state.selSec.add(name);
        paint(); return;
      }
      const ven = e.target.closest("[data-ven]");
      if (ven) {
        const id = ven.dataset.ven;
        if (state.selVenue.has(id)) state.selVenue.delete(id); else state.selVenue.add(id);
        paint(); return;
      }
      if (e.target.closest("#filt-open")) { $("filt-sheet").showModal(); return; }
      if (e.target.closest("#filt-done")) { $("filt-sheet").close(); return; }
      const fav = e.target.closest("[data-fav]");
      if (fav) { toggleFav(+fav.dataset.fav); return; }
      const resOpen = e.target.closest("[data-res-open]");
      if (resOpen) { $("res-card").close(); openDetail(+resOpen.dataset.resOpen); return; }
      const hit = e.target.closest(".block-hit, .q-hit");
      if (hit) { openDetail(+hit.dataset.id); return; }
      if (e.target.closest("#btn-program, [data-go-program]")) { state.onlyFavs = false; paint(); return; }
      if (e.target.closest("#btn-favs")) {
        state.onlyFavs = wideUi() ? !state.onlyFavs : true;
        paint(); return;
      }
      if (e.target.closest("#view-grid")) { state.view = "grid"; paint(); return; }
      if (e.target.closest("#view-list")) { state.view = "list"; paint(); return; }
      if (e.target.closest("#btn-settings")) { void openSettings(); return; }
      if (e.target.closest("#btn-res-favs")) { void bookFavs(); return; }
      if (e.target.closest("#btn-res-mine")) { void openMine(); return; }
      const unMine = e.target.closest("[data-unres-tk]");
      if (unMine) { void unresMine(unMine.dataset.unresTk, unMine.dataset.td); return; }
      const resNeed = e.target.closest("[data-res-need]");
      if (resNeed) { $("res-card").close(); void openSettings(); return; }
      const resBtn = e.target.closest("[data-res]");
      if (resBtn) {
        const it = state.items.find((x) => x.id === +resBtn.dataset.res);
        if (it) void bookItem(it, false);
        return;
      }
      const unresBtn = e.target.closest("[data-unres]");
      if (unresBtn) {
        const it = state.items.find((x) => x.id === +unresBtn.dataset.unres);
        if (it) void bookItem(it, true);
        return;
      }
      if (e.target.closest("#btn-scan-cam")) { void startCam(); return; }
      if (e.target.closest("#btn-stop-scan")) { void stopScan(); return; }
      if (e.target.closest("#btn-save-ticket")) { savePendingTicket(); return; }
      const showTk = e.target.closest("[data-show-ticket]");
      if (showTk) { void showTicket(showTk.dataset.showTicket); return; }
      const delTk = e.target.closest("[data-del-ticket]");
      if (delTk) { deleteTicket(delTk.dataset.delTicket); return; }
      if (e.target.closest("[data-close]")) { e.target.closest("dialog")?.close(); return; }
      if (e.target.closest("#btn-now")) {
        state.day = festDay(new Date());
        paint();
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        $("now-line")?.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" });
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!e.target.closest(".days")) return;
      const tabs = [...$("days").querySelectorAll("[role=tab]")];
      const i = tabs.indexOf(document.activeElement);
      if (i < 0 || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
      e.preventDefault();
      const n = tabs[(i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
      n.focus(); n.click();
    });

    let resizeT;
    let lastWide = wideUi();
    addEventListener("resize", () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        if (!state.items.length) return;
        if (wideUi() !== lastWide) { lastWide = wideUi(); paint(); return; }
        if (state.view === "grid") renderBoard();
      }, 150);
    });
    $("q").addEventListener("input", () => {
      state.query = $("q").value;
      renderMain();
      syncFiltUi();
    });
    document.addEventListener("change", (e) => {
      const ntfMins = e.target.closest("[data-notify-mins]");
      if (ntfMins) {
        state.notifyMins = clampMins(ntfMins.value);
        ntfMins.value = state.notifyMins;
        saveSettings();
        void scheduleReminders();
        return;
      }
      const ntfRes = e.target.closest("[data-notify-res]");
      if (ntfRes) {
        state.notifyRes = ntfRes.checked;
        saveSettings();
        void scheduleReminders();
        return;
      }
      const ntfFav = e.target.closest("[data-notify-fav]");
      if (ntfFav) {
        state.notifyFav = ntfFav.checked;
        saveSettings();
        void scheduleReminders();
        return;
      }
      if (e.target.closest("input[data-notify]")) {
        void setNotify(e.target.checked);
        return;
      }
      if (e.target.closest("[data-sound]")) {
        state.soundOn = e.target.checked;
        saveSettings();
        if (!state.soundOn) $("load-audio")?.pause();
        return;
      }
      const resTk = e.target.closest("[data-res-ticket]");
      if (resTk) {
        const tk = state.tickets.find((x) => x.id === resTk.dataset.resTicket);
        if (tk) {
          tk.resOn = resTk.checked;
          saveSettings();
          syncResButtons();
          const openIt = state.items.find((x) => x.id === state.detailId);
          if ($("detail").open && openIt) void refreshResChip(openIt);
        }
        return;
      }
      const rename = e.target.closest("[data-rename]");
      if (rename) {
        const tk = state.tickets.find((x) => x.id === rename.dataset.rename);
        if (tk) {
          const name = rename.value.trim();
          if (name) tk.name = name;
          saveSettings();
        }
        return;
      }
      if (e.target.id === "scan-file" && e.target.files && e.target.files[0]) {
        void scanFile(e.target.files[0]);
        e.target.value = "";
      }
    });
    $("settings").addEventListener("close", () => { void stopScan(); pendingQr = null; });
    $("busy").addEventListener("cancel", (e) => e.preventDefault());
    document.addEventListener("pointerdown", unlockLoadAudio, { once: true });
    document.addEventListener("keydown", unlockLoadAudio, { once: true });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") void scheduleReminders();
    });
    setInterval(placeNow, 30000);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
      navigator.serviceWorker.addEventListener("message", (e) => {
        if (e.data && e.data.type === "open-film") goFilm(e.data.id);
      });
    }
    load();
  </script>
</body>
</html>
